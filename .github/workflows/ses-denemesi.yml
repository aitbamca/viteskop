name: Ses denemesi

on:
  push:
    branches: [main]
    paths: ["ses_denemesi.py"]
  workflow_dispatch:
    inputs:
      sesler:
        description: "Denenecek Gemini sesleri (boşlukla ayır; boş = varsayılan 5 erkek sesi)"
        required: false

permissions:
  contents: write

jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Sesleri üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ses_denemesi.py ${{ github.event.inputs.sesler }}
      - name: Depoya kaydet
        run: |
          git config user.name "viteskop-bot"
          git config user.email "viteskop-bot@users.noreply.github.com"
          git add denemeler/
          git commit -m "Ses denemesi" || exit 0
          git pull --rebase origin main && git push origin main
