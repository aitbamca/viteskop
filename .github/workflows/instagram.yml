name: Instagram paylaşımı

on:
  # Otomatik paylaşım: INSTAGRAM_TOKEN eklenene kadar zamanlanmış çalışmalar sessizce atlanır.
  # Video adresinin hazırlanması 1-2 dakika sürdüğü için 3 dakika erken başlar: Reels 12:30 ve 20:30 civarında yayında.
  schedule:
    - cron: "27 9 * * *"   # 12:27 (Türkiye saati)
    - cron: "27 17 * * *"  # 20:27
  workflow_dispatch:
    inputs:
      islem:
        description: "kontrol = sadece bağlantıyı test et, paylas = sıradaki videoyu paylaş"
        type: choice
        options: [kontrol, paylas]
        default: kontrol
      senaryo:
        description: "Paylaşılacak senaryo dosyası, ör. 20261026-1-motor-yagi.json (boş = sıradaki)"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-paylasim
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      MEDYA_TOKEN: ${{ secrets.MEDYA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q pillow

      - name: Instagram bağlı mı?
        id: bagli
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ]; then
            echo "::notice title=Instagram::Henüz bağlanmadı (INSTAGRAM_TOKEN yok); paylaşım atlandı."
            echo "var=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi

      - name: Bağlantıyı kontrol et
        if: steps.bagli.outputs.var == 'evet'
        run: echo "::notice title=Instagram::$(python instagram.py kontrol)"

      - name: Sıradaki videoyu paylaş
        if: steps.bagli.outputs.var == 'evet' && (github.event_name == 'schedule' || github.event.inputs.islem == 'paylas')
        run: |
          ad="${{ github.event.inputs.senaryo }}"
          [ -z "$ad" ] && ad="$(python paylasilacak.py)"
          ad="$(basename "$ad")"
          if [ -z "$ad" ]; then echo "::warning title=Instagram::Paylaşılacak hazır video yok."; exit 0; fi
          video="${ad%.json}.mp4"
          if ! gh release download hazir -p "$video" -D cikti 2> indirme.log; then
            echo "::error title=Video indirilemedi::$video: $(tail -c 300 indirme.log | tr '\n' ' ')"; exit 1
          fi
          kapak="cikti/${ad%.json}.jpg"
          python kapak.py "senaryolar/$ad" "$kapak" || kapak=""  # kapak olmazsa videodan kare kullanılır
          adresler="$(bash medya_yayinla.sh koy "cikti/$video" $kapak)" || { echo "::error title=Video yayın adresine konamadı::MEDYA_TOKEN ve viteskop-medya Pages ayarını kontrol et"; exit 1; }
          adres="$(echo "$adresler" | sed -n 1p)"
          kapak_adres="$(echo "$adresler" | sed -n 2p)"
          if ! python instagram.py paylas "$adres" "senaryolar/$ad" $kapak_adres > paylasim.log 2>&1; then
            bash medya_yayinla.sh temizle || true
            echo "::error title=Instagram paylaşımı başarısız::$(tail -c 900 paylasim.log | tr '\n' ' ')"; exit 1
          fi
          bash medya_yayinla.sh temizle || echo "::warning title=Temizlik::Video viteskop-medya'dan silinemedi"
          sonuc="$(tail -1 paylasim.log)"
          echo "::notice title=Instagram::$sonuc"
          printf '%s\t%s\t%s\n' "$ad" "$(date -u +%Y-%m-%dT%H:%MZ)" "${sonuc##* }" >> yayinlananlar.txt
          git config user.name "viteskop-bot"
          git config user.email "viteskop-bot@users.noreply.github.com"
          git add yayinlananlar.txt
          git commit -m "Instagram'da paylaşıldı: $ad"
          git pull --rebase -q origin main
          git push
          gh release delete-asset hazir "$video" -y
